<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Northstar Refunds</title><style>body{font:16px system-ui;max-width:42rem;margin:4rem auto;padding:0 1rem}label{display:block;margin:1rem 0}input,button{font:inherit;padding:.5rem}pre{white-space:pre-wrap;background:#eee;padding:1rem}</style></head><body><h1>Northstar Refunds</h1><p>Training system: submit a refund for a fictional order.</p><form id="form"><label>Order <input name="order" value="order-100" required></label><label>Amount in USD <input name="amount" value="501.00" required></label><button>Submit refund</button></form><pre id="result">Response will appear here.</pre><script>document.querySelector('#form').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const r=await fetch('/orders/'+encodeURIComponent(f.get('order'))+'/refunds',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({amount:f.get('amount')})});document.querySelector('#result').textContent='HTTP '+r.status+'\n'+JSON.stringify(await r.json(),null,2)};</script></body></html>
