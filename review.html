<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Northstar review</title><style>body{font:16px system-ui;max-width:45rem;margin:3rem auto}label{display:block;margin:1rem 0}input,button,select{font:inherit;padding:.4rem}pre{white-space:pre-wrap;background:#eee;padding:1rem}</style></head><body><h1>Northstar Refunds</h1><p>Deliberately defective training build. Synthetic data only.</p><form id="request"><label>Order <input name="order" value="order-100"></label><label>Amount <input name="amount" value="500.01"></label><label>Reason <input name="reason" value="Customer request"></label><label>Idempotency key <input name="key" value="demo-1"></label><button>Submit</button></form><form id="approval"><label>Refund ID <input name="id" id="id"></label><label>Identity <select name="token"><option>demo-support</option><option>demo-finance</option></select></label><button>Approve</button></form><pre id="result"></pre><script>const result=document.querySelector('#result');document.querySelector('#request').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);let r=await fetch('/orders/'+encodeURIComponent(f.get('order'))+'/refunds',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer demo-support','Idempotency-Key':f.get('key')},body:JSON.stringify({amount:f.get('amount'),currency:'USD',reason:f.get('reason')})});let j=await r.json();if(j.id)document.querySelector('#id').value=j.id;result.textContent='HTTP '+r.status+'\n'+JSON.stringify(j,null,2)};document.querySelector('#approval').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);let r=await fetch('/refunds/'+encodeURIComponent(f.get('id'))+'/approval',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+f.get('token')},body:JSON.stringify({decision:'APPROVE',decision_reason:'Training review'})});result.textContent='HTTP '+r.status+'\n'+JSON.stringify(await r.json(),null,2)};</script></body></html>
